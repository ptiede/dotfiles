# Catppuccin Frappé for the Julia REPL
# ---------------------------------------------------------------------------
# Julia >= 1.13 faces.toml  (StyledStrings)
#
#   Install : copy to ~/.julia/config/faces.toml
#   Reload  : restart Julia, or
#             StyledStrings.load_customisations!(force=true)
#
# Palette: https://github.com/catppuccin/catppuccin  (Frappé)
#   rosewater #f2d5cf   flamingo #eebebe   pink     #f4b8e4
#   mauve     #ca9ee6   red      #e78284   maroon   #ea999c
#   peach     #ef9f76   yellow   #e5c890   green    #a6d189
#   teal      #81c8be   sky      #99d1db   sapphire #85c1dc
#   blue      #8caaee   lavender #babbf1   text     #c6d0f5
#   subtext1  #b5bfe2   subtext0 #a5adce   overlay2 #949cbb
#   overlay1  #838ba7   overlay0 #737994   surface2 #626880
#   surface1  #51576d   surface0 #414559   base     #303446
# ---------------------------------------------------------------------------


## Basic colours -------------------------------------------------------------
## Mirrors the official Catppuccin terminal palette, so `:red`, `:blue`, ...
## match what a Catppuccin-themed terminal would render.
## Note: Catppuccin maps each bright colour to its normal counterpart (except
## black/white), so `bright_red` and `red` are intentionally identical.

black          = { foreground = "#51576d" }
red            = { foreground = "#e78284" }
green          = { foreground = "#a6d189" }
yellow         = { foreground = "#e5c890" }
blue           = { foreground = "#8caaee" }
magenta        = { foreground = "#f4b8e4" }
cyan           = { foreground = "#81c8be" }
white          = { foreground = "#b5bfe2" }

bright_black   = { foreground = "#626880" }
bright_red     = { foreground = "#e78284" }
bright_green   = { foreground = "#a6d189" }
bright_yellow  = { foreground = "#e5c890" }
bright_blue    = { foreground = "#8caaee" }
bright_magenta = { foreground = "#f4b8e4" }
bright_cyan    = { foreground = "#81c8be" }
bright_white   = { foreground = "#a5adce" }

grey           = { foreground = "#737994" }
gray           = { foreground = "#737994" }

## Uncomment to force every unstyled character to the Catppuccin foreground.
## Left off by default so the REPL keeps using your terminal's own default
## text colour.
# default      = { foreground = "#c6d0f5" }


## Semantic faces ------------------------------------------------------------
## Colours follow Catppuccin's diagnostic convention:
##   error red / warning yellow / info sky / hint teal / ok green

shadow    = { foreground = "#737994" }
region    = { background = "#51576d" }
emphasis  = { foreground = "#8caaee" }
highlight = { foreground = "#303446", background = "#e5c890" }
code      = { foreground = "#81c8be" }

error     = { foreground = "#e78284" }
warning   = { foreground = "#e5c890" }
info      = { foreground = "#99d1db" }
tip       = { foreground = "#81c8be" }
note      = { foreground = "#838ba7" }
success   = { foreground = "#a6d189" }

## Logging (@debug / @info / @warn / @error). The default `bold` weight is
## preserved: user faces are merged into the built-ins, not replaced.
[log]
debug = { foreground = "#8caaee" }
info  = { foreground = "#99d1db" }
warn  = { foreground = "#e5c890" }
error = { foreground = "#e78284" }


## REPL prompts --------------------------------------------------------------
[repl_prompt]
foreground = "#c6d0f5"
julia = { foreground = "#a6d189" }
pkg   = { foreground = "#8caaee" }
help  = { foreground = "#e5c890" }
shell = { foreground = "#e78284" }
beep  = { foreground = "#737994" }

## History search (Ctrl-R, and the prefix-search hint)
[REPL.History.search]
prefix     = { foreground = "#ca9ee6" }
hint       = { foreground = "#737994" }
match      = { foreground = "#e5c890" }
results    = { foreground = "#838ba7" }
selected   = { foreground = "#8caaee" }
unselected = { foreground = "#737994" }
separator  = { foreground = "#626880" }


## Julia syntax highlighting -------------------------------------------------
## Token -> colour follows Catppuccin's own syntax specification.
[julia]
comment              = { foreground = "#949cbb", slant = "italic" }

keyword              = { foreground = "#ca9ee6" }    # function, if, end, ...
# NOTE: julia_builtin also covers the short-circuit operators `&&` and `||`,
# so those render peach rather than sky. Set this to #99d1db instead if you
# would rather they read as ordinary operators.
builtin              = { foreground = "#ef9f76" }    # typeof, &&, ||, ...
macro                = { foreground = "#f4b8e4" }     # @time, @inbounds, ...
type                 = { foreground = "#e5c890" }   # Int64, AbstractArray
funcall              = { foreground = "#8caaee" }     # f(x)
funcdef              = { foreground = "#8caaee" }     # f in `function f(x)`

number               = { foreground = "#ef9f76" }
bool                 = { foreground = "#ef9f76" }
singleton_identifier = { foreground = "#ef9f76" }    # nothing, missing
string               = { foreground = "#a6d189" }
string_delim         = { foreground = "#a6d189" }
char                 = { foreground = "#81c8be" }
char_delim           = { foreground = "#81c8be" }
cmd                  = { foreground = "#a6d189" }    # `ls -l`
cmd_delim            = { foreground = "#a6d189" }
regex                = { foreground = "#f4b8e4" }     # r"..."
backslash_literal    = { foreground = "#f4b8e4" }     # \n, \t escapes
symbol               = { foreground = "#eebebe" } # :foo

operator             = { foreground = "#99d1db" }
comparator           = { foreground = "#99d1db" }      # ==, <, >=
broadcast            = { foreground = "#99d1db" }      # the . in f.(x)
typedec              = { foreground = "#99d1db" }      # the :: in x::Int
assignment           = { foreground = "#99d1db" }      # the = in `x = 1`
opassignment         = { foreground = "#99d1db" }      # the + in `x += 1`

parentheses          = { foreground = "#949cbb" }
error                = { foreground = "#303446", background = "#e78284" }
# unpaired_parentheses inherits [julia_error, julia_parentheses] -- no need to set.

## Stack traces
[julia.stacktrace]
frameindex = { foreground = "#838ba7" }
basemodule = { foreground = "#838ba7" }
location   = { foreground = "#737994" }
filename   = { foreground = "#85c1dc" }
fileline   = { foreground = "#85c1dc" }
inlined    = { foreground = "#ef9f76" }
repetition = { foreground = "#e5c890" }

## Rainbow delimiters --------------------------------------------------------
## Nesting-depth colours for (), [] and {}, cycling back to 1 past depth 6.
## Order is Catppuccin's own rainbow: red, teal, yellow, blue, pink, flamingo.
## Comment this block out to make every bracket a flat `julia_parentheses`.

[julia.rainbow.paren]
"1" = { foreground = "#e78284" }
"2" = { foreground = "#81c8be" }
"3" = { foreground = "#e5c890" }
"4" = { foreground = "#8caaee" }
"5" = { foreground = "#f4b8e4" }
"6" = { foreground = "#eebebe" }

[julia.rainbow.bracket]
"1" = { foreground = "#e78284" }
"2" = { foreground = "#81c8be" }
"3" = { foreground = "#e5c890" }
"4" = { foreground = "#8caaee" }
"5" = { foreground = "#f4b8e4" }
"6" = { foreground = "#eebebe" }

[julia.rainbow.curly]
"1" = { foreground = "#e78284" }
"2" = { foreground = "#81c8be" }
"3" = { foreground = "#e5c890" }
"4" = { foreground = "#8caaee" }
"5" = { foreground = "#f4b8e4" }
"6" = { foreground = "#eebebe" }


## Markdown ------------------------------------------------------------------
## Used by REPL help mode (?foo) and any Markdown rendered to the terminal.
[markdown]
header       = { foreground = "#ca9ee6" }
h1           = { foreground = "#ca9ee6" }
h2           = { foreground = "#8caaee" }
h3           = { foreground = "#a6d189" }
h4           = { foreground = "#e5c890" }
h5           = { foreground = "#ef9f76" }
h6           = { foreground = "#f4b8e4" }
code         = { foreground = "#81c8be" }
inlinecode   = { foreground = "#81c8be" }
link         = { foreground = "#8caaee" }
list         = { foreground = "#85c1dc" }
latex        = { foreground = "#ca9ee6" }
footnote     = { foreground = "#ef9f76" }
hrule        = { foreground = "#626880" }
admonition   = { foreground = "#ca9ee6" }
julia_prompt = { foreground = "#a6d189" }
